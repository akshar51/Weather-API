<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-6">
                <div class="weather-card mx-auto">
                    <div class="location">New York, USA</div>
                    <div class="weather-main">
                      <div class="temp">22°C</div>
                      <div class="condition">Partly Cloudy</div>
                    </div>
                    <div class="weather-details">
                      <div class="humidity">Humidity: <span>65%</span></div>
                      <div class="wind">Wind: <span>12 km/h</span></div>
                      <div class="feel">Feels Like: <span>21°C</span></div>
                    </div>
                  </div>
            </div>
        </div>
    </div>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="./javascript/script.js"></script>
</body>
</html>
